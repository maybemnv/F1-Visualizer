[project]
version = "1.0.0"
name = "f1_visualization"
authors = [{ name = "Manav" }]
description = "F1 Visualizer - Interactive dashboard for Formula 1 race data visualization since 2018"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Environment :: Web Environment",
    "Framework :: Dash",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "fastf1>=3.8.2",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "numpy>=2.0.0",
    "seaborn>=0.13.0",
    "tomli>=2.0.0",
    "dash>=3.0.0",
    "dash-bootstrap-components>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "scikit-learn==1.8.0",
    "plotly>=5.0.0",
]

[project.optional-dependencies]
performance = ["orjson >= 3.9.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.12.0",
    "mypy>=1.0.0",
    "pandas-stubs",
    "types-seaborn",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["f1_visualization*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
preview = true
include = ["f1_visualization/**/*.py", "dashboard/**/*.py", "./*.py", "tests/**/*.py"]
line-length = 96
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    # eradicate
    "ERA",
    # flake8-annotations
    "ANN",
    # flake8-blind-except
    "BLE",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-commas
    "COM",
    # flake8-comprehensions
    "C4",
    # flake8-datetimez
    "DTZ",
    # flake8-future-annotations
    "FA",
    # flake8-implicit-str-concat
    "ISC",
    # flake8-import-conventions
    "ICN",
    # flake8-logging
    "LOG",
    # flake8-logging-format
    "G",
    # flake8-pie
    "PIE",
    # flake8-print
    "T20",
    # flake8-quotes
    "Q",
    # flake8-raise
    "RSE",
    # flake8-return
    "RET",
    # flake8-self
    "SLF",
    # flake8-simplify
    "SIM",
    # flake8-unused-arguments
    "ARG",
    # flake8-use-pathlib
    "PTH",
    # flynt
    "FLY",
    # isort
    "I",
    # pandas-vet
    "PD",
    # Numpy
    "NPY",
    # pep8-naming
    "N",
    # Perflint
    "PERF",
    # pycodestyle errors
    "E",
    # pycodestyle warnings
    "W",
    # pydocstyle
    "D1",
    "D2",
    "D3",
    "D400",
    "D401",
    "D402",
    "D403",
    "D404",
    # Pyflakes
    "F",
    # Pylint
    "PL",
    # pyupgrade
    "UP",
    # refurb
    "FURB",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]

ignore = [
    "COM812",  # compliance with previous style
    "ISC001",  # conflict with formatter
    "PTH123",  # all open calls already uses Pathlib for file handling
    "D203",    # conflict with preferred D211 (No blank lines allowed before class docstring)
    "D212",    # conflict with preferred D213 (Multi-line docstring summary should start at the second line)
    "ANN401",  # Any is valid for generic decorators/callback glue
    "D401",    # docstrings do not need imperative mood in this project
    "N803",    # scientific code commonly uses X/y notation
    "N806",    # scientific code commonly uses X/y notation
    "PD011",   # .values is acceptable for small/simple dataframe conversions
    "PERF401", # explicit loops are often clearer in Dash component construction
    "PLR6201", # tuple membership is fine for tiny fixed collections
    "PLR6301", # tests and helper methods may remain instance methods
    "RUF022",  # keep grouped __all__ blocks readable
    "PLR0912", # function too many branches
    "PLR0913", # function too many arguments
    "PLR0914", # function too many local variables
    "PLR0915", # function too many statements
    "PLR0917", # function too many positional arguments
    "TRY300",  # else blocks after successful try reduce readability here
    "UP015",   # explicit is better than implicit
    "FURB101", # Nothing wrong with using open and read
    "FURB118", # this is not better
    "TRY003",  # too nitpicky
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN",
    "D",
    "PLC0415",
    "PLR2004",
    "RUF059",
    "SIM117",
    "SLF001",
]
